<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text File Reorder Utility</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Text File Reorder Utility</h1>
		<div class="controls">
			<button id="open">Open File</button>
			<input id="search" class="search" placeholder="Search">
			<button id="save" disabled>Save File</button>
		</div>
		<div class="sort-controls">
			<button onclick="resetOrder()">Reset Order</button>
			<button onclick="sortByRank(1)">Rank ↑</button>
			<button onclick="sortByRank(-1)">Rank ↓</button>
		</div>
		<div class="table-wrapper">
			<div class="table-scroll">
				<table id="dataTable">
					<colgroup id="columnGroup"></colgroup>
					<thead>
						<tr id="headers"></tr>
					</thead>
					<tbody id="body"></tbody>
				</table>
			</div>
		</div>
		<p id="info"></p>
	</div>
	<script defer src="js/constants.js"></script>
	<script defer src="js/utils.js"></script>
	<script defer src="js/file.js"></script>
	<script defer src="js/move.js"></script>
	<script defer src="js/columns.js"></script>
	<script defer src="js/render.js"></script>
	<script defer src="js/app.js"></script>
</body>
</html>
